        <p>E-Watch is a decentralized event monitoring platform built on the Stacks blockchain. Register, search, and manage on-chain events using Clarity smart contracts and your Hiro wallet.</p>
        <h2>Features</h2>
        <ul style="list-style: none; padding: 0; text-align: left; display: inline-block;">

        </ul>
